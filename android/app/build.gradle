apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    // Topbath: `-PbundleDebugJs` embeds the JS bundle in the debug APK so it runs on a phone
    // without Metro (sideloaded test builds). Default behaviour is unchanged.
    if (project.hasProperty("bundleDebugJs")) {
        debuggableVariants = []
    }

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * White-label: app id, version and name of the selected client, written by
 * `node scripts/use-client.mjs <client-id>` (see clients/<id>/client.json).
 */
def clientPropsFile = rootProject.file("client.properties")
if (!clientPropsFile.exists()) {
    throw new GradleException("android/client.properties is missing. Run: node scripts/use-client.mjs <client-id>  (e.g. topbath)")
}
def clientProps = new Properties()
clientPropsFile.withReader("UTF-8") { clientProps.load(it) }

// Release signing (plan Task 8.3): all four properties must come from outside the repo (~/.gradle/gradle.properties or -P).
def releaseSigningKeys = ['TB_STORE_FILE', 'TB_STORE_PASSWORD', 'TB_KEY_ALIAS', 'TB_KEY_PASSWORD']
def releaseSigningReady = releaseSigningKeys.every { project.hasProperty(it) && project.property(it) }
gradle.taskGraph.whenReady { graph ->
    // only the store build types need the real key; debug and releaseRn test builds keep the debug key
    def storeTasks = graph.allTasks.findAll { t ->
        t.project == project && (t.name ==~ /(bundle|assemble|package)Release/ )
    }
    if (!storeTasks.isEmpty() && !releaseSigningReady) {
        def missing = releaseSigningKeys.findAll { !(project.hasProperty(it) && project.property(it)) }
        throw new GradleException("Release signing is not configured: missing " + missing.join(', ') +
            ". Put them in ~/.gradle/gradle.properties (TB_STORE_FILE = path to the keystore). The key is supplied by the release owner and must never be committed.")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.topsan.app"
    defaultConfig {
        applicationId clientProps.getProperty("applicationId")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode clientProps.getProperty("versionCode").toInteger()
        versionName clientProps.getProperty("versionName")
        resValue "string", "app_name", clientProps.getProperty("appName")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Plan Task 8.3: the release key never lives in the repo. The release owner puts these four properties in
        // ~/.gradle/gradle.properties (or passes -P...). Without them a store build stops with a clear message (see below).
        if (releaseSigningReady) {
            release {
                storeFile file(project.property('TB_STORE_FILE'))
                storePassword project.property('TB_STORE_PASSWORD')
                keyAlias project.property('TB_KEY_ALIAS')
                keyPassword project.property('TB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Test builds install as <applicationId>.rn so they sit next to the client's real
            // Play Store app instead of replacing it. Release keeps the plain applicationId.
            applicationIdSuffix ".rn"
            resValue "string", "app_name", clientProps.getProperty("appName") + " RN"
        }
        release {
            // Store builds (bundleRelease / assembleRelease) are signed with the release owner's key (Task 8.3).
            signingConfig releaseSigningReady ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        // Speed test build: identical to release (no dev mode, Hermes bytecode, no debug tools)
        // but installs as <applicationId>.rn, so it never touches the client's Play Store app.
        // Build: cd android && ./gradlew assembleReleaseRn
        releaseRn {
            initWith release
            matchingFallbacks = ["release"]
            // test build: always the debug key, never the store key (installs as .rn next to the Play Store app)
            signingConfig signingConfigs.debug
            applicationIdSuffix ".rn"
            resValue "string", "app_name", clientProps.getProperty("appName") + " RN"
            // The RN plugin only fills this placeholder for debug/release; use release's value.
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

repositories {
    // barcodescanner-release-2.1.5.aar: the ZXing scanner library bundled with phonegap-plugin-barcodescanner 8.1.0
    // (copied unchanged from the npm package), so the scanner screen is the shipped one.
    flatDir { dirs 'libs' }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Same library version the shipped Ionic build contains (aab META-INF/androidx.core_core-splashscreen.version = 1.0.0).
    implementation("androidx.core:core-splashscreen:1.0.0")

    // Scanner (src/native/scanner.ts): same library as phonegap-plugin-barcodescanner 8.1.0, see NativeToolsPackage.kt.
    implementation(name: 'barcodescanner-release-2.1.5', ext: 'aar')
    // The aar calls android.support.v4.content.LocalBroadcastManager; the shim in src/main/java/android/support/v4
    // forwards it to this AndroidX artifact.
    implementation("androidx.localbroadcastmanager:localbroadcastmanager:1.1.0")
    // Location-accuracy dialog (cordova-plugin-request-location-accuracy 2.3.0 used the same play-services-location).
    implementation("com.google.android.gms:play-services-location:21.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
